name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build web dashboard bundle
        run: npm ci && npm run build
      - name: Sync web bundle into Android runtime assets
        shell: bash
        run: |
          set -euo pipefail
          runtime_assets="app/src/main/assets"
          test -f dist/index.html
          test -d dist/assets

          # MainActivity uses AssetsPathHandler for /assets/, which removes that
          # URL prefix before opening a file from app/src/main/assets/.
          # Copy the current Vite entry point and its referenced files to that
          # exact runtime location; do not leave an extra nested assets/ folder.
          rm -rf "$runtime_assets/assets"
          cp dist/index.html "$runtime_assets/index.html"
          cp -R dist/assets/. "$runtime_assets/"

          # /images/ and /icons/ handlers also strip their URL prefixes.
          # Flatten generated files to the asset root while preserving the
          # existing nested folders and any native-only artwork.
          if [ -d dist/images ]; then cp -R dist/images/. "$runtime_assets/"; fi
          if [ -d dist/icons ]; then cp -R dist/icons/. "$runtime_assets/"; fi
          if [ -f dist/favicon.png ]; then cp dist/favicon.png "$runtime_assets/favicon.png"; fi

          # Fail the APK build instead of packaging an index with missing chunks.
          while IFS= read -r asset; do
            test -f "$runtime_assets/$asset" || { echo "Missing Android runtime asset: $asset"; exit 1; }
          done < <(grep -oE '(src|href)="/assets/[^"]+"' dist/index.html | cut -d '"' -f2 | sed 's#^/assets/##')

          # Keep the public mirror for other tooling.
          rm -rf "$runtime_assets/public"
          mkdir -p "$runtime_assets/public"
          cp -R dist/. "$runtime_assets/public/"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CAT2026-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
