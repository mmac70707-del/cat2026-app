name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build web dashboard bundle
        run: npm ci && npm run build
      - name: Sync web bundle into Android runtime assets
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          # MainActivity loads /assets/index.html from the root Android asset folder.
          rm -rf app/src/main/assets/assets
          mkdir -p app/src/main/assets/assets
          cp -R dist/assets/. app/src/main/assets/assets/
          cp dist/index.html app/src/main/assets/index.html
          # Overlay generated web images/icons without deleting native-only artwork.
          if [ -d dist/images ]; then mkdir -p app/src/main/assets/images; cp -R dist/images/. app/src/main/assets/images/; fi
          if [ -d dist/icons ]; then mkdir -p app/src/main/assets/icons; cp -R dist/icons/. app/src/main/assets/icons/; fi
          if [ -f dist/favicon.png ]; then cp dist/favicon.png app/src/main/assets/favicon.png; fi
          # Keep the public mirror for other tooling.
          rm -rf app/src/main/assets/public
          mkdir -p app/src/main/assets/public
          cp -R dist/. app/src/main/assets/public/
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CAT2026-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
