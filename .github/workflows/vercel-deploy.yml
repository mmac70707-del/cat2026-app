name: CAT 2026 Build Verification

on:
  push:
    branches:
      - main
      - stage-1-calendar-day-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🛡️ Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🚀 Build Vite Production PWA
        run: npx vite build

      - name: ✅ Deployment handled by Vercel Git Integration
        run: echo "Vercel Production auto-deploy is handled by the connected Git integration on main."
