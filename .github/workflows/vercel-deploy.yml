name: CAT 2026 Build Verification

on:
  push:
    branches:
      - main
      - stage-1-calendar-day-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run CAT Verification Suite
        run: npm run verify:cat

      - name: Build Vite Production PWA
        run: npm run build

      - name: Confirm Vercel Git Integration
        run: echo "Vercel production deployment is handled by the connected Git integration."
